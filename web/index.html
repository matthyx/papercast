<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Papercast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* High-contrast outdoor mode for Hannsnote2 / RLCD */
        .high-contrast {
            filter: contrast(140%) brightness(105%);
        }
        .grayscale {
            filter: grayscale(100%) contrast(150%);
        }

        /* Controls overlay */
        #hud {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            opacity: 0.25;
            transition: opacity 0.2s ease;
            z-index: 100;
        }
        #hud:hover, #hud:active {
            opacity: 1;
        }
        .btn {
            background: rgba(30, 30, 30, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .btn:active {
            background: rgba(80, 80, 80, 0.9);
        }

        #stats {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }

        #status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cbd5e1;
            font-size: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            max-width: 80%;
        }
        .hide {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="view"></canvas>
        <div id="hud">
            <button class="btn" id="btn-decoder">Decoder: Auto</button>
            <button class="btn" id="btn-contrast">Contrast</button>
            <button class="btn" id="btn-fs">Fullscreen</button>
        </div>
        <div id="stats">FPS: 0 | WebCodecs Ready</div>
        <div id="status-msg">Connecting to Papercast...</div>
    </div>

    <script>
        const canvas = document.getElementById("view");
        const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
        const statsEl = document.getElementById("stats");
        const statusEl = document.getElementById("status-msg");
        const btnFs = document.getElementById("btn-fs");
        const btnContrast = document.getElementById("btn-contrast");
        const btnDecoder = document.getElementById("btn-decoder");

        let decoder = null;
        let ws = null;
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let fps = 0;
        let hasReceivedKeyframe = false;
        let contrastModes = ["normal", "high-contrast", "grayscale"];
        let currentContrast = 0;

        let hwAccelMode = "prefer-hardware"; // "prefer-hardware" or "prefer-software"
        let autoFallbackDone = false;
        let sentCount = 0;
        let outputCount = 0;
        let lastDecodeMs = 0;
        let currentGopBuffers = [];

        btnDecoder.onclick = (e) => {
            e.stopPropagation();
            hwAccelMode = (hwAccelMode === "prefer-hardware") ? "prefer-software" : "prefer-hardware";
            autoFallbackDone = true;
            btnDecoder.textContent = (hwAccelMode === "prefer-software") ? "Decoder: SW" : "Decoder: HW";
            switchDecoderMode(hwAccelMode, "manual toggle");
        };

        btnContrast.onclick = (e) => {
            e.stopPropagation();
            canvas.classList.remove(contrastModes[currentContrast]);
            currentContrast = (currentContrast + 1) % contrastModes.length;
            if (contrastModes[currentContrast] !== "normal") {
                canvas.classList.add(contrastModes[currentContrast]);
            }
            btnContrast.textContent = contrastModes[currentContrast];
        };

        btnFs.onclick = (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        };

        // Prevent screen sleep on Hannsnote2 tablet
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        function isKeyframe(data) {
            // Scan header region for SPS (7) or IDR (5) NAL units in Annex B byte stream
            const limit = Math.min(data.length - 4, 128);
            for (let i = 0; i < limit; i++) {
                if (data[i] === 0 && data[i+1] === 0 && (data[i+2] === 1 || (data[i+2] === 0 && data[i+3] === 1))) {
                    let nalOffset = (data[i+2] === 1) ? i + 3 : i + 4;
                    let nalType = data[nalOffset] & 0x1f;
                    // 5 = IDR (Keyframe), 7 = SPS
                    if (nalType === 5 || nalType === 7) return true;
                }
            }
            return false;
        }

        function getDecoderConfig() {
            return {
                codec: "avc1.42E028", // Constrained Baseline Profile, Level 4.0
                avc: { format: "annexb" },
                optimizeForLatency: true,
                hardwareAcceleration: hwAccelMode
            };
        }

        function switchDecoderMode(newMode, reason) {
            hwAccelMode = newMode;
            btnDecoder.textContent = (hwAccelMode === "prefer-software") ? "Decoder: SW" : "Decoder: HW";
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(`Switched decoder to ${hwAccelMode} (${reason})`);
            }
            configureDecoder();
            if (currentGopBuffers.length > 0 && decoder && decoder.state === "configured") {
                for (let i = 0; i < currentGopBuffers.length; i++) {
                    const item = currentGopBuffers[i];
                    try {
                        sentCount++;
                        decoder.decode(new EncodedVideoChunk({
                            type: item.isKey ? "key" : "delta",
                            timestamp: Math.round(performance.now() * 1000),
                            data: item.data
                        }));
                    } catch (e) {
                        break;
                    }
                }
                hasReceivedKeyframe = true;
            } else {
                hasReceivedKeyframe = false;
            }
        }

        function configureDecoder() {
            if (decoder) {
                try { decoder.close(); } catch(e) {}
            }
            sentCount = 0;
            outputCount = 0;
            try {
                decoder = new VideoDecoder({
                    output: (frame) => {
                        outputCount++;
                        const nowUs = performance.now() * 1000;
                        lastDecodeMs = Math.max(0, (nowUs - frame.timestamp) / 1000);

                        try {
                            if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
                                canvas.width = frame.displayWidth;
                                canvas.height = frame.displayHeight;
                            }
                            ctx.drawImage(frame, 0, 0);
                        } catch (drawErr) {
                            console.warn("Draw frame error:", drawErr);
                        } finally {
                            frame.close();
                        }

                        if (outputCount === 1 && ws && ws.readyState === WebSocket.OPEN) {
                            const modeTag = (hwAccelMode === "prefer-software") ? "SW" : "HW";
                            ws.send(`first-frame: ${canvas.width}x${canvas.height} | decode=${lastDecodeMs.toFixed(1)}ms | mode=${modeTag}`);
                        }

                        frameCount++;
                        let now = performance.now();
                        if (now - lastFpsTime >= 1000) {
                            fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                            const modeTag = (hwAccelMode === "prefer-software") ? "SW" : "HW";
                            const inFlight = Math.max(0, sentCount - outputCount);
                            statsEl.textContent = `FPS: ${fps} | ${canvas.width}x${canvas.height} | ${lastDecodeMs.toFixed(0)}ms (${modeTag})`;
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(`stats: ${canvas.width}x${canvas.height} | ${fps} FPS | decode=${lastDecodeMs.toFixed(1)}ms | inFlight=${inFlight} | queue=${decoder.decodeQueueSize} | mode=${modeTag}`);
                            }
                            frameCount = 0;
                            lastFpsTime = now;
                        }
                        if (!statusEl.classList.contains("hide")) {
                            statusEl.classList.add("hide");
                        }
                    },
                    error: (e) => {
                        console.error("VideoDecoder error:", e);
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(`decoder-error: ${e.message || e}`);
                        }
                        if (hwAccelMode === "prefer-hardware" && !autoFallbackDone) {
                            autoFallbackDone = true;
                            switchDecoderMode("prefer-software", "hardware decoder error");
                            return;
                        }
                        hasReceivedKeyframe = false;
                        try {
                            decoder.reset();
                            decoder.configure(getDecoderConfig());
                            sentCount = 0;
                            outputCount = 0;
                        } catch(resetErr) {
                            configureDecoder();
                        }
                    }
                });
                decoder.configure(getDecoderConfig());
                return true;
            } catch (err) {
                console.error("Decoder configuration failed:", err);
                return false;
            }
        }

        async function connect() {
            if (!('VideoDecoder' in window)) {
                statusEl.textContent = "Error: WebCodecs VideoDecoder API not supported in this browser.";
                return;
            }

            statusEl.textContent = "Initializing WebCodecs...";
            statusEl.classList.remove("hide");

            if (!configureDecoder()) {
                statusEl.textContent = "Error: Failed to configure hardware video decoder.";
                return;
            }

            requestWakeLock();
            hasReceivedKeyframe = false;

            const proto = window.location.protocol === "https:" ? "wss://" : "ws://";
            const wsUrl = proto + window.location.host + "/ws";
            statusEl.textContent = "Connecting to " + wsUrl + "...";

            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                statusEl.textContent = "Waiting for desktop frames...";
            };

            ws.onmessage = (event) => {
                if (typeof event.data === "string") {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.error) {
                            statusEl.textContent = "Error: " + msg.error;
                            statusEl.classList.remove("hide");
                        }
                    } catch(e) {}
                    return;
                }

                const u8 = new Uint8Array(event.data);
                const isKey = isKeyframe(u8);

                if (isKey) {
                    currentGopBuffers = [{ data: u8, isKey: true }];
                } else if (currentGopBuffers.length > 0 && currentGopBuffers.length < 35) {
                    currentGopBuffers.push({ data: u8, isKey: false });
                }

                // If waiting for keyframe and this is not a keyframe, drop it
                if (!hasReceivedKeyframe && !isKey) {
                    return;
                }

                // Ensure decoder is configured
                if (!decoder || decoder.state !== "configured") {
                    configureDecoder();
                    if (!isKey) {
                        hasReceivedKeyframe = false;
                        return;
                    }
                }

                // Auto-detect hardware decoders (e.g. MediaTek c2.mtk.avc.decoder) that buffer
                // multiple frames in an internal DPB reorder queue without low-latency support.
                const inFlight = sentCount - outputCount;
                if (hwAccelMode === "prefer-hardware" && !autoFallbackDone && (inFlight >= 3 || (outputCount >= 5 && lastDecodeMs > 65))) {
                    autoFallbackDone = true;
                    switchDecoderMode("prefer-software", `hardware decoder buffered ${inFlight} frames (${lastDecodeMs.toFixed(0)}ms)`);
                    return;
                }

                // Drop delta frames if decoder queue backs up (>4 frames) to prevent pointer lag
                if (decoder.decodeQueueSize > 4 && !isKey) {
                    hasReceivedKeyframe = false;
                    return;
                }

                try {
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? "key" : "delta",
                        timestamp: Math.round(performance.now() * 1000),
                        data: u8
                    });
                    sentCount++;
                    const checkSeq = sentCount;
                    decoder.decode(chunk);
                    if (isKey) {
                        hasReceivedKeyframe = true;
                    }
                    // If hardware decoder holds a frame for >65ms without emitting output(frame)
                    // (waiting for subsequent frames to fill its DPB), switch to zero-buffer software decoder.
                    if (hwAccelMode === "prefer-hardware" && !autoFallbackDone) {
                        setTimeout(() => {
                            if (hwAccelMode === "prefer-hardware" && !autoFallbackDone && outputCount < checkSeq) {
                                autoFallbackDone = true;
                                switchDecoderMode("prefer-software", `hardware decoder held frame #${checkSeq} >65ms waiting for future frames`);
                            }
                        }, 65);
                    }
                } catch (err) {
                    console.warn("Decode chunk error:", err);
                    hasReceivedKeyframe = false;
                    try {
                        decoder.reset();
                        decoder.configure(getDecoderConfig());
                        sentCount = 0;
                        outputCount = 0;
                    } catch(resetErr) {
                        configureDecoder();
                    }
                }
            };

            ws.onclose = () => {
                statusEl.textContent = "Disconnected from server. Reconnecting in 2s...";
                statusEl.classList.remove("hide");
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error:", err);
            };
        }

        window.onload = connect;
    </script>
</body>
</html>
